name: Deploy web app to GitHub Pages

# Builds apps/web in showcase mode and publishes it. The app runs entirely in
# the browser — card data comes straight from Scryfall — so it needs no backend.
#
# Showcase mode is what makes this safe to hand to other people: the published
# build is read-only. It drops the Preferences tab, cannot swap
# a card's printing, and runs on a store that has no way to write, so nothing a
# visitor does touches anything of yours. See apps/web/src/showcase.ts.
#
# VITE_SHOWCASE_TITLE names the page; without it the title is "The Deck Shelf".
#
# One-time setup before this can succeed:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mtgtoolbox/web build:showcase
        env:
          VITE_SHOWCASE_TITLE: The Deck Shelf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
